---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: minikube-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.67.5-192.168.67.10 # <--- Change this to match your minikube ip subnet
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: minikube-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - minikube-pool